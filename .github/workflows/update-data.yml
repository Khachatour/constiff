name: Update constitution texts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # daily, 07:17 Yerevan time
  push:
    branches: [main]
    paths: ["scripts/fetch-data.mjs", ".github/workflows/update-data.yml"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download texts from yourconstitution.am
        run: node scripts/fetch-data.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/constitution.json
          git commit -m "Update constitution texts from yourconstitution.am"
          git push
