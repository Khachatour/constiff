name: Deploy to GitHub Pages

# Requires Settings → Pages → Source: GitHub Actions.
# Runs on every push to main, after each daily data update (commits made by the
# bot's GITHUB_TOKEN don't trigger `push`, hence `workflow_run`), and manually.
on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Update constitution texts"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that the data snapshot exists
        run: test -s data/constitution.json || { echo "data/constitution.json missing — run the 'Update constitution texts' workflow first"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
