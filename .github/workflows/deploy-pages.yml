name: Deploy to GitHub Pages

# Manual for now. Once Pages is enabled (Settings → Pages → Source: GitHub Actions),
# run this workflow from the Actions tab. To redeploy on every change, uncomment `push`.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that the data snapshot exists
        run: test -s data/constitution.json || { echo "data/constitution.json missing — run the 'Update constitution texts' workflow first"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
